name: CI/CD - Validate Manifests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: applications/ monitoring/
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
              indentation:
                spaces: 2

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm -v $(pwd):/workdir ghcr.io/yannh/kubeconform:latest \
            -summary -ignore-missing-schemas \
            /workdir/applications/ /workdir/monitoring/

  security-checks:
    name: Security Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run pre-commit security checks
        run: |
          chmod +x scripts/pre-commit-check.sh
          ./scripts/pre-commit-check.sh

  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [lint-and-validate, security-checks]
    if: always()
    
    steps:
      - name: Check results
        run: |
          echo "=========================================="
          if [ "${{ needs.lint-and-validate.result }}" == "success" ] && [ "${{ needs.security-checks.result }}" == "success" ]; then
            echo "✅ All checks passed!"
          else
            echo "❌ Some checks failed. Review logs above."
          fi
          echo "=========================================="
