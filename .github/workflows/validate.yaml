name: Validate Manifests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm -v $(pwd):/workdir ghcr.io/yannh/kubeconform:latest \
            -summary -ignore-missing-schemas \
            -skip /workdir/monitoring/prometheus/values.yaml \
            /workdir/applications/ /workdir/monitoring/

      - name: Run security checks
        run: |
          chmod +x scripts/pre-commit-check.sh
          ./scripts/pre-commit-check.sh

      - name: YAML Lint (relaxed)
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: applications/ monitoring/
          strict: false
          config_data: |
            extends: relaxed
            rules:
              line-length:
                max: 200
              indentation: disable
              document-start: disable
