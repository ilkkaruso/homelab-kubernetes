name: Validate Manifests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          wget -q https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          echo "📋 Validating Kubernetes manifests..."
          
          # Validate only actual K8s manifests (skip values.yaml)
          find applications/ monitoring/ -type f -name "*.yaml" ! -name "values.yaml" | while read file; do
            echo "Checking: $file"
            kubeconform -ignore-missing-schemas "$file"
          done
          
          echo "✅ Validation complete"

      - name: Run security checks
        run: |
          echo "🔍 Running security checks..."
          chmod +x scripts/pre-commit-check.sh
          ./scripts/pre-commit-check.sh

      - name: Summary
        run: echo "✅ All checks passed"
